<html lang="en"> 
 <head> 
 <meta charset="UTF-8"> 
 <meta name="viewport"  
 content="width=device-width, initial-scale=1.0"> 
     <title>one digit</title> 
     <style> 
 *{margin:0px;padding:0px;box-sizing:border-box;} 
     body{background-color: rgb(0,0,0); 
                color: lime; 
 }  
 h2{ 
   position: absolute ; 
   left: 50%; 
   transform: translate(-50%,0%); 
   user-select: none ; 
   animation:colores 7s 1s linear infinite; 
 } 
 @keyframes colores{ 
   from{ 
    filter: hue-rotate(0deg); 
   }to{ 
     filter: hue-rotate(360deg); 
   } 
 } 

 #xxx{ 
   position: absolute ; 
   left: 0px ; 
   top: 0px ; 
   width: 100%; 
   height: 100%; 
   border: 2px solid transparent ; 
 } 
  
 #first, #plus, #second { 
   width: calc(100% / 3); 
   height: 100px ; 
   position: absolute ; 
   top: 50px ; 
   display: grid ; 
   place-items: center ; 
   color: red ; 
   font-size: 50px; 
   font-weight: 500 ; 
   background-color: transparent ; 
   border: 2px solid lime ; 
 } 
 #first{ 
   left: 0px; 
 } 
 #plus{ 
   left: 50%; 
   transform: translate(-50%,0%); 
   border:none; 
 } 
 #second{ 
   right: 0px ; 
 } 
 #one, #two, #three { 
   width: calc(100% / 3); 
   height: 100px ; 
   position: absolute ; 
   bottom: 150px ; 
   display: grid ; 
   place-items: center ; 
   color: blue; 
   font-size: 50px; 
   background-color: transparent ; 
   border: 2px solid lime ; 
 } 
 #one{ 
   left: 0px; 
 } 
 #two{ 
   left: 50%; 
   transform: translate(-50%,0%); 
 } 
 #three{ 
   right: 0px ; 
 } 
  
 #four, #five, #six { 
   width: calc(100% / 3); 
   height: 100px ; 
   position: absolute ; 
   bottom: 50px ; 
   display: grid ; 
   place-items: center ; 
   color: blue; 
   font-size: 50px; 
   background-color: transparent ; 
   border: 2px solid lime ; 
 } 
 #four{ 
   left: 0px; 
 } 
 #five{ 
   left: 50%; 
   transform: translate(-50%,0%); 
 } 
 #six{ 
   right: 0px ; 
 } 
  
 canvas{ 
   position: absolute ; 
   width: calc(100%);  
   height: 100px ; 
   border: 2px solid transparent ; 
 } 
     </style> 
 </head> 
   <body> 
    <h2 hidden="true">one digit addition</h2> 
 
  
    <canvas id="xxx" width="360" height="670"></canvas> 
  
   <div id="first"></div> 
   <div id="plus"></div> 
   <div id="second"></div> 
  
   <div id="one"></div> 
   <div id="two"></div> 
   <div id="three"></div> 
   <div id="four"></div> 
   <div id="five"></div> 
   <div id="six"></div> 
  
 <script> 
 const xxx = document.querySelector('#xxx') 
 const ctx = xxx.getContext('2d') 
 
 //dynamic 
 xxx.width = window.innerWidth  
 xxx.height = window.innerHeight  
  
  //cellphone zte2026
  /*xxx.width = 360
  xxx.height = 670*/
  
 let reset = false  
 let locked = false 
 const textSize = innerWidth * 18 / 100
  
 let n1 = null  
 let n2 = null 
  
 let additioncolor = `hsl(${Math.random()}turn,100%,50%)` 
 let optioncolor = `hsl(${Math.random()}turn,100%,50%)` 
 let bordercolor = `hsl(${Math.random()}turn,100%,50%)` 
  
 let value = 0 
 let fivetimes  = 0 
  

 const results = [0,1,2,3,4,5] 
 const toshow = [] 
 const additionboxes = [first, second] 
 const optionboxes = [one, two, three, four, five, six] 
 const borderboxes = [first, second,one,two,three,four,five,six] 
  
  
  
 function addition(){ 
   //truncate arrays 
   results.length = 0 
   toshow.length = 0 
    n1 = Math.floor(1+Math.random()*9) 
    n2 = Math.floor(1+Math.random()*9) 
   value = n1 + n2  
   results.push(value) 
   for(let i = 0;i < 5;i++){ 
   do{ 
     fivetimes = Math.floor(1+Math.random()*18) 
    // console.log(fivetimes )  
   }while (results.includes(fivetimes )) 
   results.push(fivetimes ) 
   } 
   //console.log(results)  
 } 
 addition() 
  
  
 function options(){ 
   let chosen 
   for(let i = 0;i < 6;i++){ 
   do{ 
     const random = Math.floor(Math.random()*results.length)  
     chosen = results[random] 
   }while (toshow.includes(chosen)) 
   toshow.push(chosen) 
   } 
 } 
 options() 
 
 console.log(100/3,100/6,100/6*5); 
  
  function showaddition(){

  const iw = innerWidth
  
  ctx.beginPath()
  ctx.font = textSize + 'px Arial'
  ctx.textAlign = 'center'
  ctx.textBaseline = 'middle'

  ctx.fillStyle = additioncolor
  ctx.fillText(n1,(iw/100)*16.6,105)

  ctx.fillStyle = bordercolor
  ctx.fillText("+",(iw/100)*50,105)

  ctx.fillStyle = additioncolor
  ctx.fillText(n2,(iw/100)*83.3,105)
}
 
 


  
  //less loc (lines of code)
 function showoptions(){
   
  const positions = [
    [16.6, xxx.height - 190],
    [50, xxx.height - 190],
    [83.3, xxx.height - 190],
    [16.6, innerHeight - 90],
    [50, xxx.height - 90],
    [83.3, xxx.height - 90]
  ]
  ctx.beginPath()
  ctx.fillStyle = optioncolor
  ctx.font = textSize + 'px Arial'
  ctx.textAlign = 'center'
  ctx.textBaseline = 'middle'

  toshow.forEach((number,i)=>{
    ctx.fillText(number,
      xxx.width * positions[i][0] / 100,
      positions[i][1]
    )
  })
}


 function clear(){ 
   ctx.clearRect(0,0, xxx.width,xxx.height) 
 } 
  
  
 function updatecolors(){ 
  
     if(reset){  
    additionboxes.forEach((item)=>{  
      item.style.backgroundColor = additioncolor  
      })  
    optionboxes.forEach((item)=>{ 
     item.style.backgroundColor = optioncolor 
    }) 
    
    }else{ 
      
   additionboxes.forEach((item)=>{  
     item.style.backgroundColor = 'transparent'   
   })  
   optionboxes.forEach((item)=>{ 
     item.style.backgroundColor = 'transparent' 
   }) 
   }  
 } 
  
  
 
  function again(){
  locked = true

  setTimeout(()=>{
    reset = true
  },1000)

  setTimeout(()=>{

    newcolors()
    addition()
    options()
    render()

    unlock()

  },1500)
}

function unlock(){
  setTimeout(()=>{
    reset = false
    locked = false
    render()
  },500)
}
  
 function newcolors(){ 
 additioncolor =  
 `hsl(${Math.random()}turn,100%,50%)` 
 optioncolor = 
 `hsl(${Math.random()}turn,100%,50%)` 
 bordercolor =  
 `hsl(${Math.random()}turn,100%,50%)` 
 borderboxes.forEach((item)=>{ 
   item.style.border = `2px solid ${bordercolor}` 
 }) 
 } 
  
 newcolors() 
  
  
 
 function render(){ 
   clear() 
   updatecolors() 
   showaddition() 
   showoptions() 
 } 
 render() 
  
  function resizeCanvas(){
    xxx.width = innerWidth  
    xxx.height = innerHeight  
    render()
  }
  window.addEventListener('resize',resizeCanvas)
  
  
  
 //less loc (lines of code)
 optionboxes.forEach((item,i)=>{
  item.addEventListener('click',function(){
    if(locked) return 
    if(toshow[i] == value){
      this.style.backgroundColor = 'lime'
      again()
    }else{
      this.style.backgroundColor = 'red'
    }

  })
})
 


 </script> 
  
 <footer>            <!--              --></footer> 
 </body> 
 </html>
